name: Docker CI/CD

on:
  push:
    branches:
      - ci-cd

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-nginx:v2 .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/devops-docker-project
            git pull origin ci-cd
            sudo docker build -t devops-nginx:v2 .
            sudo docker stop devops-app || true
            sudo docker rm devops-app || true
            sudo docker run -d --name devops-app -p 8080:80 devops-nginx:v2
